services:
  migrate:
    image: ghcr.io/antonio-ivanovski/spliit-cloud-migrate:latest
    pull_policy: always
    restart: 'no'
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - dokploy-network

  mcp:
    image: ghcr.io/antonio-ivanovski/spliit-cloud-mcp:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - 3002:3002
    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL must be set}
      # Point at the Vercel-hosted API's public origin now that api no longer
      # runs in this compose stack. See docs/mcp-publishing.md.
      MCP_API_URL: ${MCP_API_URL:?MCP_API_URL must be set}
      MCP_WEB_URL: ${MCP_WEB_URL:?MCP_WEB_URL must be set}
    networks:
      - dokploy-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3002/health/readiness'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  dokploy-network:
    external: true
